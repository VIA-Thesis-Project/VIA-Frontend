services:
  - type: web
    name: via-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # The backend exposes projects without the /api prefix.
      - type: rewrite
        source: /api/projects/*
        destination: https://ubuntu-s-1vcpu-2gb-nyc1.tail5eff67.ts.net/projects/*
      - type: rewrite
        source: /api/health
        destination: https://ubuntu-s-1vcpu-2gb-nyc1.tail5eff67.ts.net/health
      # Auth, evaluations and decision-support keep the /api prefix.
      - type: rewrite
        source: /api/*
        destination: https://ubuntu-s-1vcpu-2gb-nyc1.tail5eff67.ts.net/api/*
      # React client-side routes must resolve to the SPA entry point.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
